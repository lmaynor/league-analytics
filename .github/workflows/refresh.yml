name: Refresh league data

on:
  schedule:
    # UTC, at off-peak minutes away from :00 and :30 to bypass GitHub Actions queue congestion.
    # Evening game window (7:00 PM - 2:00 AM ET / 23:00 - 06:00 UTC): every 10 min
    - cron: "7,17,27,37,47,57 23,0,1,2,3,4,5 * * *"
    # Weekend afternoon games (1:00 PM - 6:00 PM ET / 17:00 - 22:00 UTC on Sat & Sun): every 10 min
    - cron: "7,17,27,37,47,57 17-22 * * 0,6"
    # Weekday afternoon coverage (1:00 PM - 6:00 PM ET): every 30 min (exits in 5s when no games on)
    - cron: "17,47 17-22 * * 1-5"
    # Morning checkpoint for overnight roster and waiver updates (10:15 AM ET / 14:15 UTC)
    - cron: "15 14 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Is an NBA game on?
        id: gate
        env:
          SEASON: ${{ vars.SEASON }}
        run: python3 pipeline/should_run.py >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt
        if: steps.gate.outputs.run == 'true'

      - name: Fetch from ESPN and build analytics
        if: steps.gate.outputs.run == 'true'
        env:
          LEAGUE_ID: ${{ secrets.LEAGUE_ID }}
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          SWID: ${{ secrets.SWID }}
          SEASON: ${{ vars.SEASON }}
        run: python pipeline/build.py --fetch

      - name: Commit refreshed data
        if: steps.gate.outputs.run == 'true'
        run: |
          # One commit a night keeps the repo small; the site still redeploys on every run.
          # Allow committing during the late-night wrap-up window (05:00 - 06:59 UTC / 1:00 - 2:59 AM ET).
          if [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]; then
            HOUR=$(date -u +%-H)
            if [ "$HOUR" -lt 5 ] || [ "$HOUR" -gt 6 ]; then
              echo "Not the end of the night ($HOUR UTC), skipping the commit."
              exit 0
            fi
          fi
          git config user.name "league-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw site config
          git diff --cached --quiet || git commit -m "Data refresh $(date -u +'%Y-%m-%d %H:%M') UTC"
          # Someone else may have pushed meanwhile; replay this refresh on top (its data wins)
          for i in 1 2 3; do
            git pull --rebase -X theirs && git push && break
            sleep 5
          done

      - uses: actions/configure-pages@v5
        if: steps.gate.outputs.run == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.gate.outputs.run == 'true'
        with:
          path: site
      - id: deploy
        if: steps.gate.outputs.run == 'true'
        uses: actions/deploy-pages@v4
