name: Refresh league data

on:
  schedule:
    # UTC, at off-peak minutes (GitHub delays or drops runs at :00 and :30). Runs on off days skip themselves.
    # Every day: every 10 min from midday ET through the late games
    - cron: "3-58/10 17-23 * * *"
    - cron: "3-58/10 0-5 * * *"
    # Sundays (ET): every 5 min, the fastest GitHub allows
    - cron: "2-57/5 16-23 * * 0"
    - cron: "2-57/5 0-5 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Is an NBA game on?
        id: gate
        env:
          SEASON: ${{ vars.SEASON }}
        run: python3 pipeline/should_run.py >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt
        if: steps.gate.outputs.run == 'true'

      - name: Fetch from ESPN and build analytics
        if: steps.gate.outputs.run == 'true'
        env:
          LEAGUE_ID: ${{ secrets.LEAGUE_ID }}
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          SWID: ${{ secrets.SWID }}
          SEASON: ${{ vars.SEASON }}
        run: python pipeline/build.py --fetch

      - name: Commit refreshed data
        if: steps.gate.outputs.run == 'true'
        run: |
          # one commit a night keeps the repo small; the site still redeploys on every run
          if [ "$GITHUB_EVENT_NAME" != workflow_dispatch ] && ! { [ "$(date -u +%H)" = 05 ] && [ "$(date -u +%M)" -ge 40 ]; }; then
            echo "Not the end of the night, skipping the commit."; exit 0
          fi
          git config user.name "league-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw site config
          git diff --cached --quiet || git commit -m "Data refresh $(date -u +'%Y-%m-%d %H:%M') UTC"
          # someone else may have pushed meanwhile; replay this refresh on top (its data wins)
          for i in 1 2 3; do
            git pull --rebase -X theirs && git push && break
            sleep 5
          done

      - uses: actions/configure-pages@v5
        if: steps.gate.outputs.run == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.gate.outputs.run == 'true'
        with:
          path: site
      - id: deploy
        if: steps.gate.outputs.run == 'true'
        uses: actions/deploy-pages@v4
